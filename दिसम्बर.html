/* =============================== */
/* 🔍 Render + Search + Highlight */
/* =============================== */

const container = document.getElementById("mainContent");
const searchInput = document.getElementById("searchInput");

function renderData(keyword=""){
  container.innerHTML = "";

  allNews.forEach(day => {

    let filteredPoints = day.points.filter(p =>
      p.toLowerCase().includes(keyword.toLowerCase())
    );

    if(keyword && filteredPoints.length === 0) return;

    let block = document.createElement("div");
    block.className = "day-block";

    let header = document.createElement("div");
    header.className = "day-header";
    header.textContent = day.date;

    let list = document.createElement("ul");
    list.className = "news-list";

    (keyword ? filteredPoints : day.points).forEach((text, index) => {

      let li = document.createElement("li");
      li.className = "news-item";

      let num = document.createElement("div");
      num.className = "news-num";
      num.textContent = (index + 1) + ".";

      let content = document.createElement("div");
      content.className = "news-text";

      if(keyword){
        let regex = new RegExp(`(${keyword})`, "gi");
        content.innerHTML = text.replace(regex, `<span class="highlight">$1</span>`);
      }else{
        content.textContent = text;
      }

      li.appendChild(num);
      li.appendChild(content);
      list.appendChild(li);
    });

    block.appendChild(header);
    block.appendChild(list);
    container.appendChild(block);
  });
}

searchInput.addEventListener("input", e => {
  renderData(e.target.value.trim());
});

renderData();
